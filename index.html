<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFL | Главная</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        header {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(5, 5, 5, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            text-decoration: none;
            padding: 5px;
        }
        .logo span { color: #d4af37; }
        nav ul {
            list-style: none;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        nav a {
            background: transparent;
            border: none;
            color: #888;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            padding: 10px 14px;
            display: inline-block;
        }
        nav a.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }
        .page-section {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero h1 {
            font-size: 38px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 13px;
            color: #888;
            max-width: 500px;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }
        .btn {
            width: 100%;
            padding: 16px 20px;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: inline-block;
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        footer {
            padding: 25px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            color: #444;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: #050505;
        }
        @media (min-width: 768px) {
            header { flex-direction: row; justify-content: space-between; padding: 20px 40px; }
            nav ul { gap: 30px; }
            nav a { font-size: 12px; }
            .hero h1 { font-size: 5vw; }
            .btn-group { flex-direction: row; max-width: none; justify-content: center; }
            .btn { width: auto; padding: 18px 35px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">NFL<span>.</span></a>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Главная</a></li>
                <li><a href="divisions.html">Дивизионы</a></li>
                <li><a href="rules.html">Регламент</a></li>
                <li><a href="p4p.html">Рейтинг P4P</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-section">
        <div class="hero">
            <h1>Nova Fighting<br>League</h1>
            <p>Высшая лига тактических симуляций смешанных единоборств. Интеллект, тактика, доминирование.</p>
            <div class="btn-group">
                <a href="rules.html" class="btn">Инструкция и планы</a>
                <a href="https://telegra.ph/Oficialnyj-rejting-VFC-07-13" target="_blank" class="btn btn-outline">Официальный рейтинг</a>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 Nova Fighting League. All rights reserved.</footer>
</body>
</html>
