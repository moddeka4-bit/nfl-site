<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL | Турниры</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Дополнительные стили specifically для страницы турниров */
        .tournament-card {
            background: #121212;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .tournament-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .tournament-title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tournament-title span {
            color: #d4af37;
        }
        .tournament-date {
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .card-section-title {
            font-size: 18px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .fights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .fight-row {
            background: #181818;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .fight-row:hover {
            border-color: #d4af37;
            transform: translateY(-2px);
        }
        .fighter-side {
            width: 42%;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .fighter-side.right {
            text-align: right;
        }
        .vs-badge {
            background: #222;
            color: #d4af37;
            font-size: 11px;
            font-weight: 900;
            padding: 5px 10px;
            border-radius: 4px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">NFL<span>.</span></a>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="tournaments.html" class="active">Турниры</a></li>
                <li><a href="rankings.html">Рейтинг бойцов</a></li>
                <li><a href="rules.html">Регламент</a></li>
                <li><a href="p4p.html">Рейтинг P4P</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <span class="section-label">Расписание ивентов</span>
        <h1 class="page-title">Ближайшие турниры</h1>

        <!-- Карточка турнира NFL 3 -->
        <div class="tournament-card">
            <div class="tournament-header">
                <div>
                    <span style="color: #d4af37; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Номерной ивент</span>
                    <div class="tournament-title">НА ДАННЫЙ МОМЕНТ ТУРНИРОВ НЕТУ <span></span></div>
                </div>
                <div class="tournament-date"></div>
            </div>

            <div class="card-section-title"></div>

            <div class="fights-grid">
                <!-- Бой 1 -->
                <div class="fight-row">
                    <div class="fighter-side"></div>
                    <div class="vs-badge"></div>
                    <div class="fighter-side right"></div>
                </div>
        </div>

    </div>

    <footer>&copy; 2026 Nova Fighting League. All rights reserved.</footer>
</body>
</html>
